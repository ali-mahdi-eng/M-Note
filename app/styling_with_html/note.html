<!DOCTYPE html>
<html lang="en" dir="auto">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style/note.module.css" />
  <link rel="stylesheet" href="style/material-symbols-outlined.css" />
  <title>Note</title>
</head>
<body>

  <div class="Note" data-id="1">
    <!-- ToolsBar -->
    <div class="ToolsBar">
      <button class="BackButton material-symbols-outlined" data-id="1">arrow_back</button>
      <button class="EditNoteButton material-symbols-outlined" data-id="1">edit</button>
      <!-- <button class="SaveEditNoteButton material-symbols-outlined" data-id="1">save</button> -->
      <button class="AddNoteToGroupButton material-symbols-outlined" data-id="1">folder</button>
      <button class="DeleteNoteButton material-symbols-outlined" data-id="1">delete</button>
    </div>
    
    <!-- NoteTitle -->
    <input type="text" class="NoteTitle" value="Untitled-0" placeholder="Title Here">
    <!-- NoteText -->
    <textarea class="NoteText" dir="auto" placeholder="Write Note Here.."></textarea>
    <!-- NoteDate (modifyDate) -->
    <span class="ModifyDate">2026-8-20</span>
    <!-- IsModifiedIcon: يظهر فقط إذا كانت الملاحظة معدّلة (isModified = true) -->
    <span class="IsModifiedIcon material-symbols-outlined">border_color</span>
  </div>

</body>
</html>
